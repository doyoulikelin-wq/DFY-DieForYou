function disclosure(title,value,open=false){return `<details class="packet" ${open?'open':''}><summary>${esc(title)}</summary>${json(value)}</details>`;}
function checkRows(checks){return (checks||[]).map(c=>`<div class="check-row ${c.pass===false?'failed':''}"><span>${c.pass===false?'需调整':c.pass===true?'通过':'记录'}</span><div><b>${esc(c.title||c.id||'检查项')}</b><p>${esc(typeof c.evidence==='string'?c.evidence:JSON.stringify(c.evidence??''))}</p></div></div>`).join('');}
function roundChecks(){const checks=r().checks||[],passed=checks.filter(c=>c.pass===true).length,failed=checks.filter(c=>c.pass===false);return `<section class="run-box"><details class="validation-disclosure"><summary><span>本轮检查</span><b>${passed} 通过${failed.length?' · '+failed.length+' 需调整':''}</b></summary><div class="checks">${checkRows(checks)}</div></details>${failed.length?'<p class="issue-summary">未通过：'+failed.map(c=>esc(failureLabels[c.id]||c.title)).join('；')+'。</p>':''}${disclosure('本轮模拟游戏接口快照',r().snapshot)}${disclosure('传入的记忆消息（跨轮唯一上下文）',r().received_memory)}${disclosure('本轮提交给下一轮的记忆消息',r().committed_memory)}</section>`;}
function timeline(){const start=r().loop_start_unix_ms||r().start_unix_ms;const end=r().loop_completed_unix_ms||r().completed_unix_ms||start+(r().full_loop_ms||0);const span=Math.max(1,end-start);return `<div class="time-title"><h3>本轮实际时序</h3><span>空白为调度间隔 · 重叠为并发</span></div><div class="time-axis"><span>0 s</span><span>${sec(span/2)}</span><span>${sec(span)}</span></div>${(r().nodes||[]).map(n=>{const a=C.agents.find(a=>a.id===n.role);const left=Math.max(0,(n.dispatch_unix_ms-start)/span*100),width=Math.max(.65,(n.completed_unix_ms-n.dispatch_unix_ms)/span*100);return`<div class="time-row"><span>${esc(names[n.role]||n.role)} <small>${esc(n.effort)}</small></span><div class="time-track"><button type="button" data-agent="${esc(n.role)}" style="left:${left}%;width:${Math.min(width,100-left)}%;background:${a?.color||'#71849b'}" aria-label="查看${esc(names[n.role])}耗时${esc(sec(n.duration_ms))}" title="${esc(n.id)}：${sec(n.dispatch_unix_ms-start)} → ${sec(n.completed_unix_ms-start)}"></button></div><b>${sec(n.duration_ms)}</b></div>`;}).join('')}`;}
function setup(){
 document.querySelectorAll('#round-controls,#loop-metrics,#run-sections,#parallel-label').forEach(e=>e.remove());
 document.title='陪伴精灵 · Sol 实测回放';
 $('.brand p').textContent='SOL · EXECUTION REPLAY';
 $('.source-status').textContent='真实模型调用 · 游戏与用户为模拟';
 const architectureLink=$('#experiment-link');if(architectureLink){architectureLink.textContent='架构说明';architectureLink.setAttribute('href','./');}
 $('.flow-heading').innerHTML=`<div><div class="eyebrow">GPT-6.1-SOL · ISOLATED AGENTS</div><h2>试炼谷 · 兽人萨满</h2><p>三轮连续场景。点击模块，查看实际传入与传出的消息。</p></div>`;
 const controls=document.createElement('div');controls.id='round-controls';controls.className='round-controls';$('.canvas').before(controls);
 const metrics=document.createElement('div');metrics.id='loop-metrics';metrics.className='loop-metrics';$('.canvas').before(metrics);
 const sections=document.createElement('div');sections.id='run-sections';sections.className='run-sections';$('.canvas').after(sections);
 $('.phase-note').textContent='各 Agent 独立会话，只接收显式消息。';
 const link=document.querySelector('.edge[data-link="reflection memory"]');if(link)link.style.display='none';
 const labels=[...document.querySelectorAll('.edge-label')];labels.filter(e=>e.textContent==='审核后的'||e.textContent==='更新建议').forEach(e=>e.style.display='none');
 const parallelLabel=document.createElementNS('http://www.w3.org/2000/svg','text');parallelLabel.id='parallel-label';parallelLabel.setAttribute('x','311');parallelLabel.setAttribute('y','489');parallelLabel.setAttribute('text-anchor','middle');parallelLabel.setAttribute('class','edge-label');parallelLabel.textContent='并行';$('.graph-svg').appendChild(parallelLabel);
 labels.find(e=>e.textContent.includes('事实可以'))?.replaceChildren(document.createTextNode('后台并行：反思提建议，记忆记事实；汇总后传给下一轮'));
 $('.graph-help span').textContent='显示本轮实际调用；规划复用会标灰。反思的推测仅作为待核实建议，不会直接写成已确认偏好。';
 $('.mobile-loop').textContent='执行后，反馈反思与记忆整理并发；调度器汇总消息，再显式传给下一轮。';
 $('.footer-note').innerHTML='<span>所有耗时含调度、排队与消息落盘开销，不等于纯模型推理时延。</span><button class="text-button" id="download-json" type="button">下载原始结果 JSON</button>';
 $('#download-html').innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M5 17v4h14v-4"/></svg>下载回放 HTML';
}
function render(){
 $('#round-controls').innerHTML=D.rounds.map((x,i)=>`<button type="button" class="round-button ${i===roundIndex?'active':''}" data-round="${i}" aria-pressed="${i===roundIndex}"><span>0${i+1}</span>${esc(x.title)}</button>`).join('');
 $('#loop-metrics').innerHTML=`<div><span>前台回复时间</span><b>${sec(r().foreground_ms)}</b><small>从本轮开始到执行结果</small></div><div><span>完整 Loop 时间</span><b>${sec(r().full_loop_ms)}</b><small>包含后台汇总与提交</small></div><div><span>编排间隔</span><b>${sec(r().orchestration_gap_ms)}</b><small>节点计时区间外的空隙</small></div>${(r().nodes||[]).some(n=>(n.issues||[]).some(e=>e.code==='MEASUREMENT_CONTAMINATION'))?'<div class="loop-alert">本轮含协调者上下文压缩产生的额外等待，已计入原始耗时。无法精确剥离，不用于判断模型速度。</div>':''}`;
 $('#nodes').innerHTML=C.agents.map((a,i)=>{const nn=nodes(a.id),called=nn.length>0,duration=nn.reduce((v,n)=>v+(n.duration_ms||0),0),level=[...new Set(nn.map(n=>n.effort))].join('/');return`<button type="button" class="node ${a.id===selected?'selected':''} ${called?'':'not-called'}" style="--node-color:${a.color}" data-agent="${a.id}" aria-label="查看${esc(a.title)}实测记录" aria-pressed="${a.id===selected}"><div class="node-head"><span class="node-symbol"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="${icons[a.id]}"/></svg></span><span class="node-number">${called?(nn.length>1?nn.length+' 次调用':'已完成'):'本轮未调用'}</span></div><h3>${esc(names[a.id])}</h3><p>${called?'gpt-6.1-sol · '+esc(level):a.id==='planning'?(r().planner_status==='planner_skipped_for_urgency'?'紧急场景，直接复用计划':'复用前轮计划'):'本轮跳过'}</p><div class="node-meta"><span>${called?effortLabel[nn.at(-1).effort]||esc(level):'按需跳过'}</span><b>${called?sec(duration):'0 次调用'}</b></div></button>`;}).join('');
 $('#run-sections').innerHTML=`<section class="run-box">${timeline()}</section>${roundChecks()}${comparison()}${methodology()}`;
 highlight();renderDetails();fit();
}
function comparison(){if(!D.comparison?.length)return '';return `<section class="run-box"><h3>同一输入，三个思考档位</h3><p class="small-note">仅比较第 1 轮的决策模块；业务输入与指令一致，每档在主链路结束后顺序调用 1 次。右上显示调度至结果落盘耗时；两种计时都包含工具开销，不能据此推断模型的稳定速度。</p><div class="compare-grid">${D.comparison.map(c=>`<article><div class="compare-top"><span>${esc(c.effort)} · ${esc(effortLabel[c.effort]||'')}</span><b>${sec(c.duration_ms)}</b></div><p class="compare-reply">${esc(c.reply||c.output?.reply_draft||c.output?.reply||'未生成回复')}</p><div class="compare-clock">创建会话返回后至结果落盘：<b>${sec(c.ack_to_output_ms)}</b></div><details class="packet compare-checks"><summary>查看检查记录 · Token 未采集</summary><div>${checkRows(c.checks)}</div></details>${disclosure('查看本次输入、输出与计时',c)}</article>`).join('')}</div></section>`;}
function methodology(){return `<section class="run-box method-box"><h3>测试口径与发现的问题</h3><p>模型任务是真实调用，游戏快照、NPC、任务名称与玩家文字为合成场景。未连接真实客户端，也未验证无限服接口兼容性。后置反馈由脚本提供，不是模型建议实际改变游戏后得到的结果。</p><p>每次角色调用使用独立会话，不读取其他角色文件或历史。日志中列出实际传入的消息；上下轮只通过显式消息衔接。此处验证的是会话与消息隔离，不代表操作系统层面的安全隔离。</p><p>耗时从调度请求计到结果消息落盘，包含排队、工具和编排开销。用户在游戏中等待或移动的虚拟时间没有计入。当前调用通道未返回 Token 用量，因此保留空值。</p>${(D.errors||[]).map(e=>`<details class="finding"><summary>${esc(e.code||'记录问题')} · ${esc(e.phase||e.round||'')}</summary><p>${esc(e.detail||e.message||JSON.stringify(e))}</p></details>`).join('')}${(D.notes||[]).map(n=>`<p class="small-note">${esc(typeof n==='string'?n:JSON.stringify(n))}</p>`).join('')}${disclosure('完整实验方法',D.methodology)}</section>`;}
function renderDetails(){
 const a=C.agents.find(a=>a.id===selected),nn=nodes(selected),n=nn.at(-1),completed=n&&Number.isFinite(n.duration_ms);
 const response=`<div class="result-head"><div class="eyebrow">${esc(r().id)} · 本轮交付</div><div class="user-line"><b>玩家</b><p>${esc(r().user_input)}</p></div><div class="sprite-line"><b>陪伴精灵</b><p>${esc(r().reply||'本轮没有发布回复。')}</p></div><div class="feedback-line">模拟后置反馈：${esc(r().feedback)}</div></div>`;
 const basic=`<div class="detail-header"><div class="module-type">${esc(selected.toUpperCase())} · 实测消息</div><div class="detail-title"><h2>${esc(a.title)}</h2><button type="button" class="close-panel" aria-label="关闭详情"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M6 18L18 6"/></svg></button></div><p>${esc(a.summary)}</p><div class="route-tag">${n?'gpt-6.1-sol · '+esc(n.effort):'本轮复用 / 未调用'}</div></div>`;
 const role=`<section class="section"><details class="role-brief"><summary>职责与权限</summary><ul class="detail-list">${a.duties.map(v=>`<li>${esc(v)}</li>`).join('')}</ul><p>${a.powers.map(esc).join(' ')}</p><p class="small-note">${a.limits.map(esc).join(' ')}</p></details></section>`;
 let body='';
 if(!n){body=`<section class="section"><h3>本轮没有新调用</h3><p class="small-note">${selected==='planning'?'调度器明确传递并复用上一轮的单步引导计划；没有为此再创建规划会话。':'本轮未触发此模块。'}</p>${disclosure('路由记录',{round:r().id,planner_status:r().planner_status,model_calls:0})}</section>`;}
 else body=`<section class="section"><div class="section-title"><h3>基座模型与用量</h3><span class="section-hint">实际调用配置</span></div><div class="model-readonly">${esc(n.requested_model)}<b>${esc(n.effort)}</b></div><div class="token-grid"><div class="token-box"><b>—</b><span>输入 Token</span></div><div class="token-box"><b>—</b><span>输出 Token</span></div><div class="token-box"><b>${sec(nn.reduce((v,x)=>v+(x.duration_ms||0),0))}</b><span>节点任务累计耗时</span></div></div><p class="no-record">执行通道未提供 Token 计量，未以估计值替代。</p></section>
 <section class="section"><div class="section-title"><h3>信息链路</h3><span class="section-hint">只接收以下显式消息</span></div>${(n.input_messages||[]).map(m=>`<div class="message-source"><b>${esc(m.id||m.packet_id||'消息')}</b><span>${esc(m.from||'调度器')}</span></div>`).join('')}${nn.map((x,i)=>disclosure((nn.length>1?'第 '+(i+1)+' 次 · ':'')+'查看完整输入消息',x.input_messages)).join('')}<p class="no-record">独立会话；未共享其他角色上下文。${n.input_sha256?'输入摘要：'+esc(n.input_sha256.slice(0,16))+'…':''}</p></section>
 <section class="section"><div class="section-title"><h3>实际输出</h3><span class="section-hint">原始结构化结果</span></div>${nn.map((x,i)=>disclosure((nn.length>1?'第 '+(i+1)+' 次 · ':'')+'查看本模块输出',x.output,true)).join('')}</section>
 <section class="section"><div class="section-title"><h3>运行日志 Log</h3><span class="section-hint">真实计时 · 北京时间</span></div>${nn.map(x=>`<div class="log-row"><div class="log-time">${clock(x.dispatch_unix_ms)}</div><p>发起独立 ${esc(x.effort)} 会话 · ${esc(x.id)}</p></div><div class="log-row"><div class="log-time">${clock(x.completed_unix_ms)}</div><p>收到结果消息 · ${sec(x.duration_ms)}</p></div>`).join('')}</section>
 <section class="section"><div class="section-title"><h3>错误与检查记录</h3></div>${nn.flatMap(x=>x.issues||[]).length?nn.flatMap(x=>x.issues||[]).map(e=>disclosure(typeof e==='string'?e:e.code||'检查记录',e,true)).join(''):'<p class="empty-state">本节点没有被记录为调用错误。业务检查结果另见本轮检查，未将“调用成功”等同于内容正确。</p>'}</section>`;
 $('#detail-panel').innerHTML=response+basic+role+body;$('#detail-panel').scrollTop=0;
}
function highlight(){const a=C.agents.find(a=>a.id===selected);document.documentElement.style.setProperty('--accent',a.color);document.querySelectorAll('.node').forEach(n=>{n.classList.toggle('selected',n.dataset.agent===selected);n.setAttribute('aria-pressed',String(n.dataset.agent===selected));});document.querySelectorAll('.edge').forEach(e=>{const active=e.dataset.link.split(' ').includes(selected);e.classList.toggle('active',active);e.setAttribute('marker-end',active?'url(#active-arrow)':'url(#arrow)');});}
function fit(){if(window.innerWidth<=600){$('#graph-plane').style.transform='none';$('#graph-wrap').style.height='auto';return;}const w=$('#graph-wrap').clientWidth;const scale=Math.min(w/900,1.1);$('#graph-plane').style.transform=`translateX(${Math.max(0,(w-900*scale)/2)}px) scale(${scale})`;$('#graph-wrap').style.height=`${640*scale}px`;}
function close(){document.body.classList.remove('panel-open');}
function downloadBlob(text,type,name){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
document.addEventListener('click',e=>{const rb=e.target.closest('[data-round]');if(rb){roundIndex=Number(rb.dataset.round);selected='decision';render();return;}const n=e.target.closest('[data-agent]');if(n){selected=n.dataset.agent;highlight();renderDetails();document.body.classList.add('panel-open');return;}if(e.target.closest('.close-panel')||e.target.id==='mobile-backdrop')close();if(e.target.id==='download-json')downloadBlob(JSON.stringify(D,null,2),'application/json;charset=utf-8','sol-loop-results.json');});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close();});
$('#download-html').addEventListener('click',()=>{const root=document.documentElement.cloneNode(true);root.querySelector('#document-seed').textContent=JSON.stringify({roundIndex});root.querySelector('#toast-root').innerHTML='';root.querySelector('#experiment-link')?.remove();root.querySelector('body').classList.remove('panel-open');downloadBlob('<!doctype html>\n'+root.outerHTML,'text/html;charset=utf-8','陪伴精灵-Sol实测回放.html');});
setup();render();if(typeof ResizeObserver!=='undefined')new ResizeObserver(fit).observe($('#graph-wrap'));else window.addEventListener('resize',fit);
}());

</script>
</body>
</html>
