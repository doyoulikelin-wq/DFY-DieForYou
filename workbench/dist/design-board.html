function graphLayers(){const nodes=activeNodes(),ids=new Set(nodes.map(n=>n.id)),parents={};nodes.forEach(n=>parents[n.id]=state.graph.edges.filter(e=>e.to===n.id&&ids.has(e.from)).map(e=>e.from));const levels={},remaining=new Set(ids);for(let guard=0;remaining.size&&guard<nodes.length+1;guard++){let changed=false;for(const id of [...remaining])if(parents[id].every(p=>levels[p]!==undefined)){levels[id]=parents[id].length?Math.max(...parents[id].map(p=>levels[p]))+1:0;remaining.delete(id);changed=true;}if(!changed)break;}const max=Math.max(0,...Object.values(levels));for(const id of remaining)levels[id]=max+1;return{levels,parents};}

function renderAccept(){const results=state.testResults,pass=results?.filter(r=>r.pass).length||0,fail=results?.filter(r=>!r.pass).length||0,stale=results&&state.testVersion!==state.configVersion;const all=results||E.acceptance(state.settings).map(r=>({...r,pass:null,actual:'尚未运行',evidence:[]}));const shown=all.filter(r=>testFilter==='all'||(testFilter==='pass'&&r.pass===true)||(testFilter==='fail'&&r.pass===false));return heading('04 / VALIDATION & ITERATION','验收、定位，再调整','结构约束、反馈归因和真实体验分别检查。正确阻止越界行为，同样属于验收通过。',btn('runTests','运行全部模拟验收','check','primary'))+`<div class="metrics">${metric('结构用例',all.length,'使用当前参数重新生成测试链路','shield')}${metric('模拟通过',pass,results?'实际结果符合用例预期':'尚未运行','check')}${metric('需要调整',fail,stale?'参数已改变，结果需要重跑':'失败可转成待调整功能卡','alert')}${metric('真实体验验收',state.realChecks.filter(r=>r.status==='passed').length,'须填入真实证据，独立记录','eye','/ '+state.realChecks.length)}</div>${stale?'<div class="notice amber">'+icon('alert')+'<p>这些模拟结果来自旧参数版本。请重新运行，不能用旧结果验收当前方案。</p></div>':''}<div class="panel"><div class="panel-head"><div><h2>模拟回归用例</h2><div class="tiny muted">每个用例运行其专用情境。当前编辑图另外接受链路校验。</div></div><div class="actions"><div class="tab-pills">${[['all','全部'],['pass','通过'],['fail','需调整']].map(([v,l])=>`<button class="${testFilter===v?'active':''}" data-act="testFilter" data-value="${v}">${l}</button>`).join('')}</div>${results?btn('exportTests','导出结果','download','small'):''}</div></div><div class="table-wrap"><table><thead><tr><th style="width:64px">编号</th><th>验收内容</th><th>负责模块</th><th>本次结果</th><th style="width:40px"></th></tr></thead><tbody>${shown.map(r=>{const m=testMeta(r.id);return`<tr class="test-row" data-act="testDetail" data-id="${esc(r.id)}" tabindex="0"><td class="mono muted tiny">${esc(r.id)}</td><td><div class="test-name">${esc(r.title)}</div><div class="test-sub">${esc(r.expected)}</div></td><td>${roleTag(r.owner||m.owner||'system')}</td><td>${r.pass===null?chip('待运行'):r.pass?chip('通过','green'):chip('需调整','red')}</td><td>${icon('chevron')}</td></tr>${expandedTest===r.id?`<tr class="test-detail"><td colspan="5"><div class="test-detail-grid"><div><h4>输入 / 触发条件</h4><p>${esc(m.condition||formatText(r.evidence)||'按该用例内置场景运行')}</p></div><div><h4>预期结果</h4><p>${esc(r.expected)}</p></div><div><h4>本次实际结果</h4><p>${esc(formatText(r.actual))}</p></div><div><h4>调整方向</h4><p>${esc(formatText(r.adjustment||m.fix||'核对对应规则与任务依赖。'))}</p></div></div>${r.evidence?.length?'<div class="test-evidence">'+esc(formatText(r.evidence))+'</div>':''}<div class="actions" style="margin-top:14px">${btn('testToIssue','生成调整卡','plus','small',`data-id="${esc(r.id)}"`)}${btn('nav','修改规则参数','sliders','small','data-tab="rules"')}${btn('nav','检查当前链路','flow','small','data-tab="flow"')}</div></td></tr>`:''}`;}).join('')}</tbody></table></div>${shown.length?'':'<div class="panel-body"><div class="empty">没有符合筛选条件的用例。</div></div>'}</div><div class="two-col section-space"><div class="panel"><div class="panel-head"><div><h2>当前编辑链路的校验</h2><div class="tiny muted">图 v${state.graphVersion} · 与场景用例分开检查</div></div>${btn('nav','定位并调整','flow','small','data-tab="flow"')}</div><div class="panel-body">${validationPanel()}</div></div><div class="panel pad"><h3>一次完整的调整闭环</h3><ol class="info-list"><li>展开未通过项，核对输入、预期与证据。</li><li>生成调整卡，指定负责角色和人工负责人。</li><li>修改任务依赖、思考档位或规则参数。</li><li>保存新版本，重跑相关模拟与日志回放。</li><li>在受控真实会话中验收体验，再考虑发布。</li></ol></div></div><div class="panel section-space"><div class="panel-head"><div><h2>真实接入后的验收记录</h2><div class="tiny muted">本区不会被模拟结果自动勾选。实际通过需要你填写可追溯的证据。</div></div>${chip('独立人工记录','amber')}</div><div class="panel-body">${state.realChecks.map(r=>`<div class="real-check"><div class="real-check-top"><h3>${esc(r.title)}</h3><select data-real-status="${esc(r.id)}" aria-label="${esc(r.title)}状态" style="font-size:11px"><option value="pending" ${r.status==='pending'?'selected':''}>待真实验证</option><option value="passed" ${r.status==='passed'?'selected':''}>已验证通过</option><option value="adjust" ${r.status==='adjust'?'selected':''}>需要调整</option></select></div><p>${esc(r.description)}</p><textarea data-real-evidence="${esc(r.id)}" aria-label="${esc(r.title)}证据" placeholder="填写记录编号、实际观察、评审结论或数据来源……">${esc(r.evidence)}</textarea></div>`).join('')}</div></div>`;}

function renderRoles(){return heading('06 / RESPONSIBILITIES','分工清楚，共同表现为一个精灵','角色是职责边界，节点是本次具体任务。多个角色可以复用模型，每次只唤醒需要的部分。')+`<div class="role-grid">${C.roles.map(r=>{const rr=role(r.id);return`<article class="panel role-card" style="--role-color:${rr.color};--role-bg:${rr.color}14"><div class="role-initial">${esc(rr.label.slice(0,1))}</div><div class="role-title"><h3>${esc(r.title)}</h3>${chip(r.thinking)}</div><p>${esc(r.trigger)}</p><details><summary>查看输入、输出与验收标准</summary><div class="role-detail">${[['输入',r.input],['必须交付',r.output],['权限',r.permission],['验收标准',r.acceptance],['避免的情况',r.avoid]].map(([l,v])=>`<div class="detail-row"><strong>${l}</strong><div class="value">${esc(formatText(v))}</div></div>`).join('')}</div></details></article>`;}).join('')}</div><div class="section-space"><h2>从模拟走向真实系统</h2><p class="muted small-text">保留证据、范围与版本，让每次调整都能说明原因。</p><div class="guide-grid">${C.guide.map(g=>`<article class="panel guide-card"><h3>${esc(g.title)}</h3><p>${esc(g.body)}</p></article>`).join('')}</div></div><div class="panel pad section-space"><h3>设计依据与适用边界</h3><p class="small-text muted">本页方案来自本次讨论。以下原始资料支持路由、反思记忆和人类互动反馈等技术方向；具体阈值、六角色分工与页面预演均为本项目的设计建议。</p><div class="sources"><a href="https://www.anthropic.com/research/building-effective-agents" target="_blank" rel="noopener">Anthropic · Building effective agents（路由与程序检查） ↗</a><a href="https://arxiv.org/abs/2303.11366" target="_blank" rel="noopener">Reflexion（通过反馈与记忆改善后续行为） ↗</a><a href="https://arxiv.org/abs/2509.25137" target="_blank" rel="noopener">RL from User Conversations（自然互动反馈） ↗</a><a href="https://arxiv.org/abs/2503.13657" target="_blank" rel="noopener">Why Do Multi-Agent LLM Systems Fail?（协作与验证问题） ↗</a></div></div>`;}

function openFeature(id){const f=state.features.find(f=>f.id===id);if(!f)return;modal(esc(f.title),`<div class="form-grid"><div class="field full"><label>功能名称</label><input id="f-title" value="${esc(f.title)}"></div><div class="field"><label>方案状态</label><select id="f-status">${Object.entries(statuses).map(([v,[l]])=>`<option value="${v}" ${f.status===v?'selected':''}>${l}</option>`).join('')}</select></div><div class="field"><label>负责 Agent / 模块</label><select id="f-role">${Object.values(E.ROLES).map(r=>`<option value="${r.id}" ${f.role===r.id?'selected':''}>${esc(r.name)}</option>`).join('')}</select></div><div class="field"><label>人工负责人</label><input id="f-owner" placeholder="待指定" value="${esc(f.owner||'')}"></div><div class="field"><label>优先级</label><select id="f-priority"><option ${f.priority==='P0'?'selected':''}>P0</option><option ${f.priority==='P1'?'selected':''}>P1</option></select></div><div class="field full"><label>功能说明</label><textarea id="f-summary">${esc(f.summary)}</textarea></div><div class="field full"><label>验收标准 · 每行一项</label><textarea id="f-criteria" style="min-height:132px">${esc(f.acceptance.join('\n'))}</textarea></div><div class="field full"><label>失败后调整方向</label><textarea id="f-adjustment">${esc(f.adjustment)}</textarea></div><div class="field full"><label>实际验收记录 / 待确定问题</label><textarea id="f-notes" placeholder="记录真实证据、问题与下一步；模拟通过不等于真实验收……">${esc(f.notes||'')}</textarea></div></div>`,btn('closeModal','取消','','')+btn('saveFeature','保存修改','check','primary',`data-id="${esc(id)}"`),`${esc(id)} / FUNCTION SPEC`);}

function editEdges(id){const n=state.graph.nodes.find(n=>n.id===id);if(!n)return;const before=state.graph.edges.filter(e=>e.to===id);modal('调整任务依赖',`<h3>${esc(n.label)}</h3><p class="small-text muted">前置任务全部完成后才会启动。新增依赖会改变并发与时序；固定关系由程序保留。</p><div class="edge-list">${before.map(e=>`<div class="edge-row"><span>${esc(nodeName(e.from))}</span>${icon('arrow')}<span>本任务</span>${e.hard?chip('固定','amber'):btn('removeEdge','移除','','small',`data-from="${esc(e.from)}" data-to="${esc(e.to)}"`)}</div>`).join('')||'<div class="empty">当前没有前置依赖</div>'}</div><div class="divider"></div><div class="field"><label>添加必须先完成的任务</label><select id="edge-from">${activeNodes().filter(x=>x.id!==id&&!before.some(e=>e.from===x.id)).map(x=>`<option value="${esc(x.id)}">${esc(x.label)} · ${x.phase==='back'?'后台':'前台'}</option>`).join('')}</select></div><div class="actions" style="margin-top:12px">${btn('addEdge','增加依赖','plus','primary small',`data-id="${esc(id)}"`)}</div><div class="notice amber section-space">${icon('info')}<p>错误依赖会被校验器指出，不会自动运行。请回到图中检查提示。</p></div>`,btn('closeModal','完成','check','primary'),'DEPENDENCY EDITOR');}

function compile(readInputs=true){stopRun();if(readInputs)$$('[data-input]').forEach(el=>{const key=el.dataset.input;state.input[key]=el.type==='checkbox'?el.checked:el.type==='number'||['complexity','uncertainty'].includes(key)?Math.max(0,num(el.value)):el.value;});state.graph=E.plan(copy(state.input),copy(state.settings));state.graphVersion++;state.graph.version=state.graphVersion;state.dirtyPlan=false;state.selectedNode=state.graph.nodes.find(n=>n.id==='planner')?.id||state.graph.nodes[0]?.id;faults.feedback=state.input.feedback;invalidate();logChange('根据当前情境重新规划：'+(E.SCENARIOS.find(s=>s.id===state.scenario)?.title||state.scenario));render();toast('链路已更新，已重新计算依赖与并发。');}

case'nav':setTab(el.dataset.tab);break;
case'feature':openFeature(id);break;
case'boardGroup':state.boardGroup=el.dataset.value;save();render();break;
case'closeModal':closeModal();break;
case'modalBackdrop':if(e.target===el)closeModal();break;
case'addFeature':addFeature();break;
case'createFeature':{const title=$('#new-feature-title').value.trim(),criteria=$('#new-feature-criteria').value.split('\n').map(x=>x.trim()).filter(Boolean);if(!title||!criteria.length){toast('请填写功能名称和至少一项验收标准。',true);break;}state.features.push({id:'F'+Date.now().toString(36),title,role:$('#new-feature-role').value,phase:$('#new-feature-phase').value,priority:'P1',status:'todo',summary:$('#new-feature-summary').value.trim(),acceptance:criteria,adjustment:'待补充'});logChange('新增功能：'+title);closeModal();render();break;}
case'saveFeature':{const f=state.features.find(f=>f.id===id),title=$('#f-title').value.trim(),criteria=$('#f-criteria').value.split('\n').map(x=>x.trim()).filter(Boolean);if(!title||!criteria.length){toast('名称和验收标准不能为空。',true);break;}Object.assign(f,{title,status:$('#f-status').value,role:$('#f-role').value,owner:$('#f-owner').value.trim(),priority:$('#f-priority').value,summary:$('#f-summary').value.trim(),acceptance:criteria,adjustment:$('#f-adjustment').value.trim(),notes:$('#f-notes').value.trim()});logChange('更新功能标准：'+f.title);closeModal();render();toast('功能标准已保存。');break;}
case'scenario':{const sc=E.SCENARIOS.find(s=>s.id===id);state.scenario=id;state.input=copy(sc.input);compile(false);break;}
case'compile':compile();break;
case'diagramMode':state.diagramMode=el.dataset.mode;save();render();break;
case'phase':state.phaseFilter=el.dataset.value;save();render();break;
case'node':state.selectedNode=id;if(state.tab==='flow'){save();render();}else{stopRun();setTab('flow');}break;
case'disableNode':{const n=state.graph.nodes.find(n=>n.id===id);if(n.required){toast('该任务是当前行为的必要约束。',true);break;}if(n.custom){state.graph.nodes=state.graph.nodes.filter(x=>x.id!==id);state.graph.edges=state.graph.edges.filter(x=>x.from!==id&&x.to!==id);state.graph.skipped.push({id,label:n.label,reason:'手动删除自定义任务'});}else state.graph=E.toggleNode(state.graph,id,false);state.selectedNode='';graphChange('跳过可选任务：'+n.label);break;}
case'enableNode':state.graph=E.toggleNode(state.graph,id,true);graphChange('恢复任务：'+nodeName(id));break;
case'editEdges':editEdges(id);break;
case'addEdge':{const from=$('#edge-from')?.value;if(!from){toast('没有可添加的任务。');break;}state.graph.edges.push({from,to:id,hard:false,reason:'手动设置的先后关系'});graphChange('增加依赖：'+nodeName(from)+' → '+nodeName(id));editEdges(id);break;}
case'removeEdge':state.graph.edges=state.graph.edges.filter(x=>!(x.from===el.dataset.from&&x.to===el.dataset.to&&!x.hard));graphChange('移除可调整依赖');editEdges(el.dataset.to);break;
case'addNode':addNode();break;
case'createNode':{const label=$('#n-label').value.trim(),reason=$('#n-reason').value.trim();if(!label||!reason){toast('请填写任务名称和调用理由。',true);break;}const node={id:'task_'+Date.now().toString(36),label,role:$('#n-role').value,phase:$('#n-phase').value,thought:$('#n-thought').value,duration:Math.max(1,Math.min(60000,num($('#n-duration').value))),required:false,enabled:true,reason,custom:true};if($('#n-write').checked)node.resource='memory-write';const parent=node.phase==='back'?(state.graph.nodes.find(n=>n.id==='feedback')||state.graph.nodes.find(n=>n.id==='receipt')):(state.graph.nodes.find(n=>n.id==='snapshot')||state.graph.nodes[0]);state.graph.nodes.push(node);if(parent)state.graph.edges.push({from:parent.id,to:node.id,hard:false,reason:'自定义任务的初始前置，可编辑'});state.selectedNode=node.id;closeModal();graphChange('添加任务实例：'+label);toast('任务已添加；请设置其后续使用关系。');break;}
case'injectCycle':{const ns=activeNodes();if(ns.length<2)break;state.graph.edges.push({from:ns[ns.length-1].id,to:ns[0].id,hard:false,reason:'异常演示：循环依赖'});graphChange('异常演示：加入循环依赖');toast('已注入异常；校验器应阻止运行。');break;}
case'removeReview':if(!state.graph.nodes.some(n=>n.id==='review')){toast('当前链路无需对外表达，没有该审核节点。');break;}state.graph.nodes=state.graph.nodes.filter(n=>n.id!=='review');state.graph.edges=state.graph.edges.filter(e=>e.from!=='review'&&e.to!=='review');graphChange('异常演示：模拟规划器删除必要审核');break;
case'roleHelp':setTab('roles');setTimeout(()=>{const els=$$('.role-card');const idx=C.roles.findIndex(r=>r.id===id);if(els[idx]){els[idx].querySelector('details').open=true;els[idx].scrollIntoView({behavior:'smooth',block:'center'});}},20);break;
case'playRun':playRun();break;
case'stepRun':stopRun();if(!run){if(!setupRun())break;render();}runTime=(run.events.find(e=>num(e.time)>runTime)?.time)||runMaxTime();refreshRun();break;
case'resetRun':stopRun();run=null;runTime=0;render();break;
case'exportRun':if(run)exportFile('陪伴精灵_模拟轨迹.json',JSON.stringify({simulation:true,graphVersion:state.graphVersion,configVersion:state.configVersion,graph:state.graph,faults,result:run},null,2));break;
case'runToIssue':if(run){addIssue('预演调整：'+(E.SCENARIOS.find(s=>s.id===state.scenario)?.title||''),run.outcome,'system',['调整后重新运行该场景，核对输出与记忆结果。'],run.memoryOutcome);render();}break;
case'runTests':state.testResults=E.acceptance(copy(state.settings));state.testVersion=state.configVersion;logChange('运行模拟验收：'+state.testResults.filter(r=>r.pass).length+'/'+state.testResults.length+' 通过');render();toast('模拟验收已完成；真实体验仍需实际记录。');break;
case'testFilter':testFilter=el.dataset.value;render();break;
case'testDetail':expandedTest=expandedTest===id?null:id;render();break;
case'testToIssue':{const r=(state.testResults||E.acceptance(state.settings)).find(r=>r.id===id);if(r){addIssue('调整：'+r.title,formatText(r.adjustment||testMeta(id).fix),r.owner,[r.expected],r.id+' · '+formatText(r.actual));render();}break;}
case'exportTests':exportFile('陪伴精灵_模拟验收结果.json',JSON.stringify({simulation:true,configVersion:state.testVersion,currentConfigVersion:state.configVersion,settings:state.settings,results:state.testResults,realChecks:state.realChecks},null,2));break;
case'snapshot':snapshot();break;
case'confirmSnapshot':{const name=$('#version-name').value.trim()||'未命名版本';state.versions.push({id:'v'+Date.now().toString(36),name,time:timeLabel(),graphVersion:state.graphVersion,configVersion:state.configVersion,data:snapshotData()});if(state.versions.length>15)state.versions.shift();logChange('保存版本：'+name);closeModal();render();toast('版本已保存，可在“规则与版本”中恢复。');break;}
case'restoreVersion':{const v=state.versions.find(v=>v.id===id);if(!v)break;modal('恢复方案版本',`<p>恢复到 <strong>${esc(v.name)}</strong>。</p><p class="small-text muted">当前内容会先保存为一个回退版本，再应用选定版本。</p>`,btn('closeModal','取消')+btn('confirmRestore','恢复版本','reset','primary',`data-id="${esc(id)}"`),'RESTORE VERSION',true);break;}
case'confirmRestore':{const v=copy(state.versions.find(v=>v.id===id));if(!v)break;state.versions.push({id:'v'+Date.now().toString(36),name:'恢复前自动备份',time:timeLabel(),graphVersion:state.graphVersion,configVersion:state.configVersion,data:snapshotData()});Object.assign(state,v.data);state.graphVersion++;state.configVersion++;const inputKeys=new Set([...Object.keys(state.input||{}),...Object.keys(state.graph?.input||{})]);const inputMismatch=!state.graph||[...inputKeys].some(k=>JSON.stringify(state.input?.[k])!==JSON.stringify(state.graph.input?.[k]));const settingsMismatch=!state.graph||Object.keys(E.DEFAULTS).some(k=>Number(state.settings[k])!==Number(state.graph.settings?.[k]));state.dirtyPlan=!!v.data.dirtyPlan||inputMismatch||settingsMismatch;invalidate();logChange('恢复版本：'+v.name);closeModal();render();toast(state.dirtyPlan?'已恢复，当前条件需重新规划，再重跑模拟验收。':'已恢复，模拟验收需重新运行。');break;}
case'export':exportFile('陪伴精灵_协作方案.json',JSON.stringify(state,null,2));toast('方案已导出，可在另一设备导入。');break;
case'downloadHtml':downloadHtml();break;
case'applySettings':{let changed=false;$$('[data-setting]').forEach(el=>{const k=el.dataset.setting,v=Math.round(Math.max(num(el.min),Math.min(num(el.max),num(el.value))));if(state.settings[k]!==v){state.settings[k]=v;changed=true;}});if(state.settings.heavySlots>state.settings.maxParallel){state.settings.heavySlots=state.settings.maxParallel;changed=true;}if(changed){state.configVersion++;state.dirtyPlan=true;invalidate();logChange('应用新的规则参数');}render();toast(changed?'参数已应用，请重新规划并重跑验收。':'当前参数已保存。');break;}
case'import':$('#import-file').click();break;
case'resetAll':modal('恢复初始方案',`<p>恢复本工作台的默认功能卡、参数和场景。</p><p class="small-text muted">当前内容将先保存为回退版本；已有手动版本保留。</p>`,btn('closeModal','取消')+btn('confirmReset','恢复初始方案','reset','danger'),'RESET',true);break;
case'confirmReset':{const backup={id:'v'+Date.now().toString(36),name:'恢复初始前自动备份',time:timeLabel(),graphVersion:state.graphVersion,configVersion:state.configVersion,data:snapshotData()},versions=[...state.versions,backup];state=initial();state.versions=versions.slice(-15);state.graph=E.plan(state.input,state.settings);state.tab='rules';invalidate();logChange('恢复初始设计方案');closeModal();render();break;}
}}catch(err){toast('操作未完成：'+err.message,true);console.error(err);}});
document.addEventListener('change',e=>{const el=e.target;try{
if(el.id==='board-role'){boardRole=el.value;render();}
if(el.dataset.input){const key=el.dataset.input;state.input[key]=el.type==='checkbox'?el.checked:el.type==='number'||['complexity','uncertainty'].includes(key)?Math.max(0,num(el.value)):el.value;state.dirtyPlan=true;invalidate();save();render();}
if(el.dataset.nodeField){const n=state.graph.nodes.find(n=>n.id===el.dataset.id);n[el.dataset.nodeField]=el.dataset.nodeField==='duration'?Math.max(1,Math.min(60000,num(el.value))):el.value;graphChange('调整任务参数：'+n.label);}
if(el.dataset.setting){const k=el.dataset.setting;state.settings[k]=Math.max(num(el.min),Math.min(num(el.max),num(el.value)));if(k!=='modelTimeScale')state.settings[k]=Math.round(state.settings[k]);if(state.settings.heavySlots>state.settings.maxParallel)state.settings.heavySlots=state.settings.maxParallel;state.configVersion++;state.dirtyPlan=true;invalidate();logChange('修改参数：'+({'maxParallel':'总并发上限',heavySlots:'重思考并发上限',replyDeadlineMs:'前台响应期限',retryLimit:'审核修改上限',activeCooldownMinutes:'主动互动间隔',maxProbesPerSession:'会话试探上限'}[k]||k)+' = '+state.settings[k]);render();}
if(el.dataset.fault){faults[el.dataset.fault]=el.type==='checkbox'?el.checked:el.value;stopRun();run=null;runTime=0;render();}
if(el.id==='run-speed'){runSpeed=num(el.value);}
if(el.dataset.realStatus){const r=state.realChecks.find(r=>r.id===el.dataset.realStatus);if(el.value==='passed'&&!r.evidence.trim()){toast('请先填写真实验收依据，再标记通过。',true);el.value=r.status;return;}r.status=el.value;logChange('更新真实验收记录：'+r.title);render();}
if(el.dataset.realEvidence){const r=state.realChecks.find(r=>r.id===el.dataset.realEvidence);r.evidence=el.value;if(!r.evidence.trim()&&r.status==='passed')r.status='pending';save();}
}catch(err){toast(err.message,true);}});
document.addEventListener('input',e=>{if(e.target.dataset.realEvidence){const r=state.realChecks.find(r=>r.id===e.target.dataset.realEvidence);if(r){r.evidence=e.target.value;if(!r.evidence.trim()&&r.status==='passed')r.status='pending';save();}}if(e.target.id==='board-search'){const pos=e.target.selectionStart;boardSearch=e.target.value;$('#main').innerHTML=renderBoard();attachDrag();const input=$('#board-search');input.focus();input.setSelectionRange(pos,pos);}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('feature-card')){e.preventDefault();openFeature(e.target.dataset.id);}if(e.key==='Enter'&&e.target.classList.contains('test-row')){expandedTest=expandedTest===e.target.dataset.id?null:e.target.dataset.id;render();}if(e.key==='Tab'&&$('#modal-root .modal')){const elems=Array.from($('#modal-root .modal').querySelectorAll('button,input,select,textarea,[tabindex="0"]')).filter(n=>!n.disabled);if(!elems.length)return;const first=elems[0],last=elems[elems.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
$('#import-file').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>5000000)throw Error('方案文件超过 5 MB，无法导入。');const parsed=JSON.parse(await file.text());validImport(parsed);const backup={id:'v'+Date.now().toString(36),name:'导入前自动备份',time:timeLabel(),graphVersion:state.graphVersion,configVersion:state.configVersion,data:snapshotData()};state={...initial(),...parsed,docId:DOC_ID,versions:[...(parsed.versions||[]).slice(-13),backup],tab:'board'};if(!state.graph)state.graph=E.plan(state.input,state.settings);invalidate();logChange('导入方案：'+file.name);render();toast('已导入方案；可在版本记录中恢复导入前内容。');}catch(err){toast('导入失败：'+err.message,true);}e.target.value='';});
window.addEventListener('beforeunload',()=>{save();stopRun();});
window.CompanionStudio={getState:()=>copy(state),getRun:()=>run?copy(run):null,engine:E,validate:()=>issues()};
render();save();
})();

</script>
</body></html>
