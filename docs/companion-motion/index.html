  const rows = field('何时播放',item.condition)+field('触发依据',item.evidence)+field('何时退出',item.exit)+(item.secondary ? field('另一入口',item.secondary):'');
  const sound = field('语音类型',item.voice)+field('开口条件',item.gate)+field('表演提示',item.direction);
  const faq = item.faq.length ? '<h3>关联问答</h3><p class="faq"><code>'+item.faq.map(esc).join('、')+'</code>　'+esc(item.faqNote)+'</p>' : '';
  const proposal = item.proposal ? '<h3>拟联动</h3><p class="faq">'+esc(item.proposal)+'</p>' : '';
  const line = item.line ? '<blockquote class="quote" aria-label="台词或人声示例">'+esc(item.line)+'</blockquote>' : '';
  return '<article class="detail"><p class="selected-id">'+esc(item.id)+' · '+esc(item.route)+'</p><h2>'+esc(item.name)+'</h2><p class="lede">'+esc(item.scene)+' · '+esc(item.play)+' · '+esc(item.sec)+' 秒</p><a class="video" href="'+esc(item.video)+'" target="_blank" rel="noopener noreferrer">看完整动作 ↗</a><h3>播放条件</h3><dl>'+rows+'</dl><h3>声音与台词</h3>'+line+'<dl>'+sound+'</dl>'+faq+proposal+'</article>';
}
function drawSelection() {
  byId('desktop-detail').innerHTML = detail(selected);
  byId('inspector').scrollTop = 0;
  if (byId('dialog').open) byId('mobile-detail').innerHTML = detail(selected);
}
function drawPage() {
  const pageItems = matches.slice((page-1)*pageSize,page*pageSize);
  byId('grid').innerHTML = pageItems.map(item => '<button type="button" id="card-'+item.id+'" class="card" data-action="'+item.id+'" aria-pressed="'+(selected===item)+'"><span class="thumb"><img src="'+item.image+'" alt="" width="160" height="90"></span><span class="card-text"><span class="card-name">'+esc(item.name)+'</span><span class="card-meta"><span class="identifier">'+item.id+'</span> · '+esc(item.route)+'</span></span></button>').join('');
  byId('empty').hidden = matches.length>0;
  byId('pagination').hidden = matches.length<=pageSize;
  const pages = Math.ceil(matches.length/pageSize);
  byId('page-number').textContent = page+' / '+pages;
  byId('prev').disabled = page===1;
  byId('next').disabled = page>=pages;
  byId('result-count').textContent = matches.length+' 个动作';
  drawSelection();
}
function filterList() {
  const terms = byId('search').value.trim().toLocaleLowerCase().split(/\s+/).filter(Boolean);
  const faq = byId('faq').value, voice = byId('voice').value;
  matches = actions.filter(item => (route==='全部' || item.route===route) && (!voice || item.voice===voice) && (!faq || (item.faq.length>0)===(faq==='yes')) && terms.every(word=>item.searchText.includes(word)));
  page=1; selected = matches[0] || null; drawPage();
}
byId('routes').addEventListener('click',event => {
  const button=event.target.closest('[data-route]'); if(!button) return;
  route=button.dataset.route; drawRoutes(); filterList();
  byId('routes').querySelector('[aria-pressed="true"]').focus({preventScroll:true});
});
byId('search').addEventListener('input',filterList);
byId('faq').addEventListener('change',filterList);
byId('voice').addEventListener('change',filterList);
byId('reset').addEventListener('click',() => {
  route='全部'; byId('search').value=''; byId('faq').value=''; byId('voice').value=''; drawRoutes(); filterList(); byId('search').focus();
});
byId('grid').addEventListener('click',event => {
  const card=event.target.closest('[data-action]'); if(!card) return;
  lastCardId=card.id; selected=actions.find(item=>item.id===card.dataset.action);
  byId('grid').querySelectorAll('[aria-pressed="true"]').forEach(button=>button.setAttribute('aria-pressed','false'));
  card.setAttribute('aria-pressed','true'); drawSelection();
  if (compactView.matches) {byId('mobile-detail').innerHTML=detail(selected); byId('dialog').showModal(); byId('dialog').scrollTop=0;}
});
function turnPage(step) {
  page+=step; selected=matches[(page-1)*pageSize]; drawPage();
  const card=byId('grid').querySelector('.card'); if(card) card.focus({preventScroll:true});
  byId('library-heading').scrollIntoView({block:'start'});
}
byId('prev').addEventListener('click',()=>turnPage(-1));
byId('next').addEventListener('click',()=>turnPage(1));
byId('close').addEventListener('click',()=>byId('dialog').close());
byId('dialog').addEventListener('close',()=>{byId('mobile-detail').innerHTML=''; byId(lastCardId)?.focus({preventScroll:true});});
compactView.addEventListener('change',()=>{if(!compactView.matches && byId('dialog').open) byId('dialog').close();});
drawRoutes(); drawPage();
</script>
</body></html>
